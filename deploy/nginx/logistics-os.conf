# NGINX Configuration for Logistics OS
# Routes:
# kamran.downlabs.co -> Next.js Frontend (port 3000)
# api.kamran.downlabs.co -> FastAPI Backend (port 8000)

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name kamran.downlabs.co api.kamran.downlabs.co;
    return 301 https://$host$request_uri;
}

# Frontend Server Block
server {
    listen 443 ssl http2;
    server_name kamran.downlabs.co;

    # SSL Certificates (managed by Certbot later)
    # ssl_certificate /etc/letsencrypt/live/kamran.downlabs.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kamran.downlabs.co/privkey.pem;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend Server Block
server {
    listen 443 ssl http2;
    server_name api.kamran.downlabs.co;

    # SSL Certificates (managed by Certbot later)
    # ssl_certificate /etc/letsencrypt/live/api.kamran.downlabs.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.kamran.downlabs.co/privkey.pem;

    # Gzip Compression
    gzip on;
    gzip_types application/json;

    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for longer requests
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
